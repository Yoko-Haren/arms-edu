{% if on_vercel %}<script>
        // Vercel Web Analytics. Only the page's path is counted: searches and filters in the address stay out of it.
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
        window.va('beforeSend', function (event) {
            var url = new URL(event.url);
            url.search = '';
            event.url = url.toString();
            return event;
        });
    </script>
    <script defer src="/_vercel/insights/script.js"></script>{% endif %}
