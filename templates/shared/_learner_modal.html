{% load static %}
{# One learner (View): the average and level, the record, and Poro AI's recommendation in every subject; Print (static/shared/js/learner-record.js). #}
<div class="tp-modal" id="lrModal" role="dialog" aria-modal="true" aria-labelledby="lrTitle" hidden data-poro-img="{% static 'shared/poro/Poro.png' %}">
    <div class="tp-modal-card lr-card" tabindex="-1">
        <div class="tp-modal-head">
            <div><h3 id="lrTitle">Learner</h3><p class="hint" id="lrSub"></p></div>
            <div class="lr-head-acts">
                <a class="btn btn-line btn-sm" id="lrPrint" href="#" target="_blank" rel="noopener" hidden
                   title="This learner's record and recommendations, to print or save as PDF"><i class="fi fi-rr-print"></i> Print</a>
                <button type="button" class="icon-btn" data-close aria-label="Close"><i class="fi fi-rr-cross-small"></i></button>
            </div>
        </div>
        <div class="tp-modal-body" id="lrBody" aria-live="polite"></div>
    </div>
</div>
<script src="{% static 'shared/js/learner-record.js' %}?v=20261113"></script>
